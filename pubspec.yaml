name: starcanvas
description: "星绘工坊 - 安卓视觉小说编辑器与播放器"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^13.3.2
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  path: ^1.9.1
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
